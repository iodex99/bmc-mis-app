# Builds the BMC MIS .exe and publishes it as a GitHub Release whenever
# a tag matching v*.*.* is pushed.
#
# Required repo secret:
#   UPDATER_TOKEN  — a fine-grained PAT (Contents: read-only) for THIS repo.
#                    It is embedded into the .exe so the installed app can
#                    download future releases.
#
# The standard GITHUB_TOKEN (auto-provided) is used only to create the release.

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        env:
          BMC_MIS_GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          BMC_MIS_GH_REPO:  ${{ github.repository }}
        run: python build.py

      - name: Resolve tag name
        id: tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "manual-$(Get-Date -Format yyyyMMddHHmm)" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package release zip
        shell: pwsh
        run: |
          $zip = "BMC-MIS-${{ steps.tag.outputs.tag }}.zip"
          Compress-Archive -Path "dist\BMC MIS\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload as workflow artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bmc-mis-${{ steps.tag.outputs.tag }}
          path: ${{ env.ZIP }}
